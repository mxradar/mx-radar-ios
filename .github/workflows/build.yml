name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd ios && xcodegen generate
      - name: Build + package IPA
        run: |
          cd ios
          xcodebuild -project MXRadar.xcodeproj -scheme MXRadar \
            -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -name 'MXRadar.app' -path '*/Release-iphoneos/*' | head -1)
          echo "APP: $APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qr MXRadar.ipa Payload)
          ls -lh build/
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MXRadar
          path: ios/build/*.ipa
